                                onclick="sendCustomKey(customKeys[${index}])">
                            <i data-lucide="${iconName}" style="width: 14px; height: 14px;"></i>
                            <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px;">
                                <span style="font-size: 12px; font-weight: 600;">${key.label}</span>
                                <span style="font-size: 10px; color: var(--text-tertiary);">${displayText}</span>
                            </div>
                        </button>
                        <button onclick="deleteCustomKey(${index})"
                                style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
                                       background: transparent; border: none; color: var(--text-tertiary);
                                       cursor: pointer; padding: 4px; display: flex; align-items: center;
                                       border-radius: 6px; transition: all 0.2s ease;"
                                onmouseover="this.style.background='var(--tertiary-bg)'; this.style.color='var(--accent-danger)';"
                                onmouseout="this.style.background='transparent'; this.style.color='var(--text-tertiary)';">
                            <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
                        </button>
                    </div>
                `;
            }).join('');

            // Refresh Lucide icons
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        // Delete custom key
        function deleteCustomKey(index) {
            if (confirm('Delete this custom key?')) {
                customKeys.splice(index, 1);
                saveCustomKeysToStorage();
                renderCustomKeys();
                showToast('Custom key deleted');
            }
        }

        // Open custom key modal
        function openCustomKeyModal() {
            const modal = document.getElementById('customKeyModal');
            modal.style.display = 'flex';

            // Reset form
            document.getElementById('customKeyLabel').value = '';
            document.getElementById('customKeyType').value = 'command';
            document.getElementById('customKeyCommand').value = '';
            document.getElementById('customKeyIcon').value = '';
            document.getElementById('ctrlKey').checked = false;
            document.getElementById('shiftKey').checked = false;
            document.getElementById('altKey').checked = false;
            document.getElementById('metaKey').checked = false;
            document.getElementById('mainKey').value = '';
            updateCustomKeyForm();

            // Refresh icons
            setTimeout(() => {
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }, 50);
        }

        // Close custom key modal
        function closeCustomKeyModal() {
            document.getElementById('customKeyModal').style.display = 'none';
        }

        // Update custom key form based on type
        function updateCustomKeyForm() {
            const type = document.getElementById('customKeyType').value;
            const commandGroup = document.getElementById('commandInputGroup');
            const keyComboGroup = document.getElementById('keyComboGroup');

            if (type === 'command') {
                commandGroup.style.display = 'flex';
                keyComboGroup.style.display = 'none';
            } else {
                commandGroup.style.display = 'none';
                keyComboGroup.style.display = 'flex';
            }
        }

        // Update key preview
        function updateKeyPreview() {
            const preview = document.getElementById('keyPreview');
            const ctrl = document.getElementById('ctrlKey').checked;
            const shift = document.getElementById('shiftKey').checked;
            const alt = document.getElementById('altKey').checked;
            const meta = document.getElementById('metaKey').checked;
            const mainKey = document.getElementById('mainKey').value;

            if (!mainKey && !ctrl && !shift && !alt && !meta) {
                preview.textContent = 'Press keys...';
                return;
            }

            const parts = [];
            if (ctrl) parts.push('Ctrl');
            if (shift) parts.push('Shift');
            if (alt) parts.push('Alt');
            if (meta) parts.push('Meta');
            if (mainKey) parts.push(mainKey);

            preview.textContent = parts.join(' + ') || 'Press keys...';
        }

        // Save custom key
        function saveCustomKey() {
            const label = document.getElementById('customKeyLabel').value.trim();
            const type = document.getElementById('customKeyType').value;
            const icon = document.getElementById('customKeyIcon').value.trim();

            if (!label) {
                showToast('Please enter a label');
                return;
            }

            const keyData = {
                label,
                type,
                icon: icon || null
            };

            if (type === 'command') {
                const command = document.getElementById('customKeyCommand').value.trim();
                if (!command) {
                    showToast('Please enter a command');
                    return;
                }
                keyData.command = command;
                keyData.cursorOffset = 0;
            } else {
                const ctrl = document.getElementById('ctrlKey').checked;
                const shift = document.getElementById('shiftKey').checked;
                const alt = document.getElementById('altKey').checked;
                const meta = document.getElementById('metaKey').checked;
                const mainKey = document.getElementById('mainKey').value.trim();

                if (!mainKey) {
                    showToast('Please enter a key');
                    return;
                }

                keyData.ctrl = ctrl;
                keyData.shift = shift;
                keyData.alt = alt;
                keyData.meta = meta;
                keyData.key = mainKey;
            }

            customKeys.push(keyData);
            saveCustomKeysToStorage();
            renderCustomKeys();
            closeCustomKeyModal();
            showToast('Custom key saved!');
        }

        // Add event listeners for key preview
        document.addEventListener('DOMContentLoaded', () => {
            const mainKeyInput = document.getElementById('mainKey');
            const checkboxes = ['ctrlKey', 'shiftKey', 'altKey', 'metaKey'];

            if (mainKeyInput) {
                mainKeyInput.addEventListener('input', updateKeyPreview);
                checkboxes.forEach(id => {
                    const checkbox = document.getElementById(id);
                    if (checkbox) {
                        checkbox.addEventListener('change', updateKeyPreview);
                    }
                });

        // Copy selection
        function copySelection() {
            if (!terminal) return;
            const selection = terminal.getSelection();
            if (selection) {
                navigator.clipboard.writeText(selection).then(() => {
                    showToast('Text Copied');
                }).catch(() => {
                    showToast('Copy Failed');
                });
            } else {
                showToast('Nothing Selected');
            }
        }

        // Paste text
        async function pasteText() {
            if (!terminal || !socket || !sessionId) return;
            
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    socket.emit('terminal:input', {
                        sessionId: sessionId,
                        data: text
                    });
                    showToast('Text Pasted');
                }
            } catch (err) {
                const text = prompt('Enter text to paste:');
                if (text) {
                    socket.emit('terminal:input', {
                        sessionId: sessionId,
                        data: text
                    });
                }
            }
        }

        // Clear terminal
        function clearTerminal() {
            if (terminal) {
                terminal.clear();
                showToast('Terminal Cleared');
            }
        }

        // Share terminal
        function shareTerminal() {
            if (!shareId) {
                showToast('No shareable session');
                return;
            }
            
            const shareUrl = `${window.location.origin}/terminal/${shareId}`;
            
            // Try to copy to clipboard
            navigator.clipboard.writeText(shareUrl).then(() => {
                showToast('Share URL copied to clipboard!');
                
                // Also show in a dialog for manual copying
                const dialog = confirm(`Terminal share URL:\n\n${shareUrl}\n\nURL has been copied to clipboard. Click OK to open in new tab.`);
                if (dialog) {
                    window.open(shareUrl, '_blank');
                }
            }).catch(() => {
                // Fallback to prompt
                prompt('Copy this share URL:', shareUrl);
            });
        }

        // Attach to TTY

                    fontWeightBold: '700',
                    letterSpacing: 0,
                    theme: {
                        background: '#000000',
                        foreground: '#E4E4E7',
                        cursor: '#0A84FF',
                        cursorAccent: '#000000',
                        selectionBackground: 'rgba(10, 132, 255, 0.3)',
                        selectionForeground: '#FFFFFF',
                        black: '#27272A',
                        red: '#FF6B6B',
                        green: '#51CF66',
                        yellow: '#FFC078',
                        blue: '#4DABF7',
                        magenta: '#CC5DE8',
                        cyan: '#5AC8FA',
                        white: '#E4E4E7',
                        brightBlack: '#71717A',
                        brightRed: '#FF8787',
                        brightGreen: '#8CE99A',
                        brightYellow: '#FFD43B',
                        brightBlue: '#74C0FC',
                        brightMagenta: '#E599F7',
                        brightCyan: '#99E9F2',
                        brightWhite: '#FAFAFA'
                    },
                    scrollback: 10000,
                    convertEol: true,
                    lineHeight: isMobile ? 1.3 : 1.2,
                    cursorStyle: 'block',
                    cursorWidth: 2,
                    bellStyle: 'none',
                    allowTransparency: true
                });

                // Add fit addon
                const fitAddon = new FitAddon.FitAddon();
                terminal.loadAddon(fitAddon);
                terminal.fitAddon = fitAddon;

                // Open terminal
                const screen = document.getElementById('terminalScreen');
                terminal.open(screen);
                fitAddon.fit();

                // Create socket if not exists
                if (!socket) {
                    socket = io(config.socketUrl || window.location.origin, {
                        transports: ['websocket'],
                        reconnection: true
                    });
                }
            }

            // Store TTY session info
            window.ttySession = { device, mode };

            // Emit attach event
            socket.emit('tty:attach', { device, mode });

            // Listen for TTY events (remove old listeners first)
            socket.off('tty:attached');
            socket.off('tty:data');
            socket.off('tty:error');
            socket.off('tty:closed');

            socket.on('tty:attached', (data) => {
                console.log('Attached to TTY:', data);
                currentSessionId = data.sessionId;
                showToast(`Connected to ${data.device} (${data.mode} mode)`);
            });

            socket.on('tty:data', (data) => {
                if (data.sessionId === currentSessionId) {
                    terminal.write(data.data);
                }
            });

            socket.on('tty:error', (data) => {
                console.error('TTY Error:', data);
                showToast('TTY Error: ' + data.error);
            });

            socket.on('tty:closed', (data) => {
                if (data.sessionId === currentSessionId) {
                    terminal.write('\r\n[TTY Session Closed]\r\n');
                }
            });
        }

                        brightBlue: '#74C0FC',
                        brightMagenta: '#E599F7',

                        brightWhite: '#FAFAFA'
                    },
                    scrollback: 10000,
                    convertEol: true,
                    lineHeight: isMobile ? 1.3 : 1.2,
                    cursorStyle: 'block',
                    cursorWidth: 2,
                    bellStyle: 'none',
                    allowTransparency: true
                });

                // Add fit addon
                const fitAddon = new FitAddon.FitAddon();
                terminal.loadAddon(fitAddon);
                terminal.fitAddon = fitAddon;

                // Open terminal
                const screen = document.getElementById('terminalScreen');
                terminal.open(screen);
                fitAddon.fit();

                // Create socket if not exists
                if (!socket) {
                    socket = io(config.socketUrl || window.location.origin, {
                        transports: ['websocket'],
                        reconnection: true
                    });
                }
            }

            // Store tmux session info
            window.tmuxSession = { sessionName, mode };

            // Emit attach event
            socket.emit('tmux:attach', { sessionName, mode });

            // Listen for tmux events (remove old listeners first)
            socket.off('tmux:attached');
            socket.off('tmux:data');
            socket.off('tmux:error');

            socket.on('tmux:attached', (data) => {
                console.log('Attached to tmux:', data);
                currentSessionId = data.sessionId;
                showToast(`Connected to tmux session: ${data.sessionName}`);

        // Connect to existing session
        function connectToExistingSession(session) {
            // Hide welcome and show terminal header
            document.getElementById('welcome').style.display = 'none';
            const terminalHeader = document.getElementById('terminalHeader');
            if (terminalHeader) {
                terminalHeader.style.display = 'flex';
            }

            // Create xterm with mobile-optimized settings
            terminal = new Terminal({
                cursorBlink: true,
                fontSize: isMobile ? 14 : 14,
                fontFamily: '"Cascadia Code", "Courier New", monospace',
                theme: {
                    background: '#000814',
                    foreground: '#e0e0e0',
                    cursor: '#00ff88'
                },
                scrollback: 5000,
                convertEol: true,
                lineHeight: isMobile ? 1.2 : 1.0
            });

            // Add fit addon
            const fitAddon = new FitAddon.FitAddon();
            terminal.loadAddon(fitAddon);
            terminal.fitAddon = fitAddon;

            // Open terminal
            const screen = document.getElementById('terminalScreen');
            terminal.open(screen);
            fitAddon.fit();

            // Store the shareId if we have it
            if (session.shareId) {
                shareId = session.shareId;
            }

            // Create socket
            socket = io(config.socketUrl || window.location.origin, {
                transports: ['websocket'],
                reconnection: true
            });

            // Socket events for existing session
            socket.on('connect', () => {
                if (session.shareId) {
                    // Connect to existing session by shareId
                    socket.emit('terminal:connect', {
                        shareId: session.shareId
                    });
                } else if (session.sessionId) {
                    // Try to find shareId from sessionId
                    fetch('/api/sessions')
                        .then(res => res.json())
                        .then(sessions => {
                            const found = sessions.find(s => s.sessionId === session.sessionId);
                            if (found && found.shareId) {
                                shareId = found.shareId;
                                socket.emit('terminal:connect', {
                                    shareId: found.shareId
                                });
                            } else {
                                // Create new session if not found
                                socket.emit('terminal:create', {
                                    cols: terminal.cols,
                                    rows: terminal.rows,
                                    shareable: true,
                                    name: 'GridTerminal'
                                });
                            }
                        })
                        .catch(() => {
                            // Create new session on error
                            socket.emit('terminal:create', {
                                cols: terminal.cols,
                                rows: terminal.rows,
                                shareable: true,
                                name: 'GridTerminal'
                            });
                        });
                }
            });

            // Handle terminal:connected event
            socket.on('terminal:connected', (data) => {
                sessionId = data.sessionId;
                shareId = data.shareId;
                terminal.writeln(`\x1b[32m✓ Connected to existing session\x1b[0m`);
                if (data.name) {
                    terminal.writeln(`\x1b[36m📝 Session: ${data.name}\x1b[0m`);
                }
                if (data.recreated) {
                    terminal.writeln(`\x1b[33m⚠ Session was inactive, recreated\x1b[0m`);
                }
                terminal.writeln('');
            });
            
            socket.on('terminal:history', (data) => {
                // Restore terminal history
                if (data.data) {
                    terminal.write(data.data);
                    terminal.scrollToBottom();
                }
            });

            // Handle terminal:created event (fallback)
            socket.on('terminal:created', (data) => {
                sessionId = data.sessionId;
                shareId = data.shareId;
                terminal.writeln(`\x1b[32m✓ New Terminal Created\x1b[0m`);
                if (data.shareId) {
                    terminal.writeln(`\x1b[36m🔗 Share: ${data.shareId}\x1b[0m\n`);
                }
            });

            socket.on('terminal:data', (data) => {
                terminal.write(data.data, () => {
                    if (data.token) {
                        socket.emit('terminal:ack', {
                            sessionId: sessionId,
                            tokens: [data.token]
                        });
                    }
                    terminal.scrollToBottom();
                });
            });

            socket.on('terminal:error', (error) => {
                terminal.writeln(`\n\x1b[31m✗ Error: ${error.message}\x1b[0m`);
                showToast(error.message);
            });

            socket.on('disconnect', () => {
                terminal.writeln(`\n\x1b[31m✗ Connection lost\x1b[0m`);
            });

            socket.on('reconnect', () => {
                terminal.writeln(`\n\x1b[32m✓ Reconnected\x1b[0m`);
                if (shareId) {
                    socket.emit('terminal:connect', { shareId });
                }
            });

            // Terminal input
            terminal.onData((data) => {
                if (socket && sessionId) {
                    socket.emit('terminal:input', {
                        sessionId: sessionId,
                        data: data
                    });
                    setTimeout(() => terminal.scrollToBottom(), 50);
                }
            });

            // Terminal resize
            terminal.onResize(({ cols, rows }) => {
                if (socket && sessionId) {
                    socket.emit('terminal:resize', {
                        sessionId: sessionId,
                        cols: cols,
                        rows: rows
                    });
                }
            });

            // Focus terminal
            terminal.focus();
        }

        // Show toast
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s reverse';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // Setup event listeners
        function setupEventListeners() {
            // Window resize
            window.addEventListener('resize', () => {
                if (terminal && terminal.fitAddon) {
                    terminal.fitAddon.fit();
                }
            });

            // Prevent scrolling
            document.addEventListener('touchmove', function(e) {
                if (!e.target.closest('.terminal-screen') && !e.target.closest('.controls-content')) {
                    e.preventDefault();
                }
            }, { passive: false });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 't') {
                    e.preventDefault();
                    createTerminal();
                }
                
                if (e.ctrlKey && e.key === 'k') {
                    e.preventDefault();
                    toggleControls();
                }
            });
        }

            try {
                const response = await fetch('/api/sessions');
                const sessions = await response.json();

                const welcomeSub = document.getElementById('welcomeSub');
                const sessionsList = document.getElementById('sessionsList');

                if (sessions && sessions.length > 0) {
                    welcomeSub.textContent = 'Choose a session or create a new one';

                    let html = '<div style="display: grid; gap: 12px; padding: 0 20px;">';
                    sessions.forEach(session => {
                        html += `
                            <div style="padding: 16px; background: #2C2C2E; border: 1px solid #444; border-radius: 10px; cursor: pointer; transition: all 0.2s;"
                                 onclick="connectToSession('${session.sessionId}')"
                                 onmouseover="this.style.borderColor='#0A84FF'; this.style.background='#1a3a5a';"
                                 onmouseout="this.style.borderColor='#444'; this.style.background='#2C2C2E';">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                                    <div style="font-weight: 600; color: #fff;">${session.name || 'Terminal ' + session.sessionId.substring(0, 8)}</div>
                                    <div style="font-size: 11px; color: ${session.isActive ? '#32D74B' : '#999'};">${session.isActive ? '● Active' : '○ Detached'}</div>
                                </div>
                                <div style="font-size: 13px; color: #999;">Created: ${new Date(session.created).toLocaleString()}</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    sessionsList.innerHTML = html;
                } else {
                    welcomeSub.textContent = 'Tap "New" to start a session';
                    sessionsList.innerHTML = '';
                }
            } catch (error) {
                console.error('Failed to load sessions:', error);
                document.getElementById('welcomeSub').textContent = 'Tap "New" to start a session';
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            // Initialize Lucide icons
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
            loadConfig();
            // Load sessions list if on welcome screen
            if (!shareId && !sessionId) {
                loadSessionsList();
            }
        });
