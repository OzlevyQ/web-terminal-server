<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A84FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5E5CE6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A84FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#5E5CE6;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="120" fill="url(#bgGradient)"/>

  <!-- Outer glow -->
  <rect x="10" y="10" width="492" height="492" rx="110" fill="none" stroke="url(#glowGradient)" stroke-width="20" opacity="0.4"/>

  <!-- Terminal window background -->
  <rect x="80" y="120" width="352" height="280" rx="16" fill="#000000" opacity="0.3"/>

  <!-- Terminal prompt symbol ">" -->
  <path d="M 140 200 L 220 256 L 140 312" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cursor -->
  <rect x="250" y="244" width="80" height="24" rx="4" fill="#0A84FF" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Port indicator dots (bottom right) -->
  <circle cx="400" cy="360" r="12" fill="#32D74B" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="370" cy="360" r="10" fill="#FF453A" opacity="0.6"/>
  <circle cx="340" cy="360" r="8" fill="#FF9F0A" opacity="0.5"/>
</svg>
