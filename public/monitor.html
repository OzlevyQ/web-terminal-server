<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessions Monitor - Web Terminal Server</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2358A6FF'/><text x='50' y='65' text-anchor='middle' font-size='50' fill='%23ffffff'>📊</text></svg>" />
    
    <style>
        :root {
            --primary-bg: #0D1117;
            --secondary-bg: #161B22;
            --tertiary-bg: #21262D;
            --accent-color: #58A6FF;
            --accent-hover: #79C0FF;
            --success-color: #238636;
            --warning-color: #F85149;
            --text-primary: #F0F6FC;
            --text-secondary: #8B949E;
            --text-muted: #6E7681;
            --border-color: #30363D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--primary-bg);
        }

        .refresh-btn {
            background: var(--tertiary-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--primary-bg);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            transition: all 0.2s ease;
        }

        .stat-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .stat-value.success {
            color: var(--success-color);
        }

        .stat-value.warning {
            color: var(--warning-color);
        }

        /* Server Info */
        .server-info {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .server-status {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-indicator.online {
            background: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
        }

        .status-indicator.offline {
            background: var(--warning-color);
            box-shadow: 0 0 8px var(--warning-color);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .server-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            font-size: 14px;
        }

        .server-detail {
            display: flex;
            gap: 8px;
        }

        .server-detail-label {
            color: var(--text-secondary);
        }

        .server-detail-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* Sessions Table */
        .sessions-section {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sessions-grid {
            display: grid;
            gap: 12px;
        }

        .session-card {
            background: var(--tertiary-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 16px;
            align-items: center;
            transition: all 0.2s ease;
        }

        .session-card:hover {
            border-color: var(--accent-color);
            transform: translateX(4px);
        }

        .session-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .session-status.active {
            background: var(--success-color);
            box-shadow: 0 0 6px var(--success-color);
        }

        .session-status.inactive {
            background: var(--text-muted);
        }

        .session-info {
            display: grid;
            gap: 4px;
        }

        .session-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .session-details {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .session-detail {
            display: flex;
            gap: 4px;
        }

        .session-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: var(--tertiary-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-secondary);
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--primary-bg);
        }

        .action-btn.danger:hover {
            background: var(--warning-color);
            border-color: var(--warning-color);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .empty-subtext {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Error State */
        .error-message {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid var(--warning-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .error-icon {
            color: var(--warning-color);
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .session-card {
                grid-template-columns: auto 1fr;
                gap: 12px;
            }

            .session-actions {
                grid-column: span 2;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                <div class="logo">▦</div>
                <span>Terminal Sessions Monitor</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="refresh-btn" onclick="window.location.href='/'">
                    <span>◈</span>
                    <span>Home</span>
                </button>
                <button class="refresh-btn" onclick="window.open('/', '_blank')">
                    <span>+</span>
                    <span>New Terminal</span>
                </button>
                <button class="refresh-btn" onclick="fetchData()">
                    <span>↻</span>
                    <span>Refresh</span>
                </button>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Active Sessions</div>
                <div class="stat-value success" id="activeSessions">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Saved Sessions</div>
                <div class="stat-value" id="savedSessions">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Data</div>
                <div class="stat-value" id="totalData">0 KB</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Server Uptime</div>
                <div class="stat-value" id="uptime">0s</div>
            </div>
        </div>

        <!-- Server Info -->
        <div class="server-info">
            <div class="server-status">
                <div class="status-indicator offline" id="serverStatus"></div>
                <span id="serverStatusText">Checking server...</span>
            </div>
            <div class="server-details" id="serverDetails">
                <div class="server-detail">
                    <span class="server-detail-label">URL:</span>
                    <span class="server-detail-value" id="serverUrl">-</span>
                </div>
                <div class="server-detail">
                    <span class="server-detail-label">Security:</span>
                    <span class="server-detail-value" id="securityLevel">-</span>
                </div>
                <div class="server-detail">
                    <span class="server-detail-label">Start Directory:</span>
                    <span class="server-detail-value" id="startDir">-</span>
                </div>
            </div>
        </div>

        <!-- Active Sessions -->
        <div class="sessions-section">
            <h2 class="section-title">
                <span>▢</span>
                <span>Active Terminal Sessions</span>
            </h2>
            <div id="sessionsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Loading sessions...</div>
                </div>
            </div>
        </div>

        <!-- Saved Sessions -->
        <div class="sessions-section" style="margin-top: 20px;">
            <h2 class="section-title">
                <span>◉</span>
                <span>Saved Sessions</span>
            </h2>
            <div id="savedSessionsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Loading saved sessions...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = window.location.origin;
        let refreshInterval = null;
        let totalBytes = 0;

        // Fetch all data
        async function fetchData() {
            try {
                // Get health status
                const healthResponse = await fetch(`${API_BASE}/health`);
                const health = await healthResponse.json();
                
                // Get saved sessions
                const sessionsResponse = await fetch(`${API_BASE}/api/sessions`);
                const savedSessions = await sessionsResponse.json();
                
                // Get config
                const configResponse = await fetch(`${API_BASE}/api/config`);
                const config = await configResponse.json();
                
                // Update UI
                updateServerStatus(health, config);
                updateStats(health, savedSessions);
                updateActiveSessions(health.sessions);
                updateSavedSessions(savedSessions);
                
            } catch (error) {
                console.error('Error fetching data:', error);
                showError('Unable to connect to server');
            }
        }

        // Update server status
        function updateServerStatus(health, config) {
            const statusIndicator = document.getElementById('serverStatus');
            const statusText = document.getElementById('serverStatusText');
            const serverUrl = document.getElementById('serverUrl');
            
            if (health.status === 'healthy') {
                statusIndicator.className = 'status-indicator online';
                statusText.textContent = 'Server Online';
                serverUrl.textContent = config.baseUrl || window.location.origin;
            } else {
                statusIndicator.className = 'status-indicator offline';
                statusText.textContent = 'Server Offline';
            }
            
            // Security level (would need to be added to server response)
            document.getElementById('securityLevel').textContent = 'Full Access';
            document.getElementById('startDir').textContent = '/';
        }

        // Update statistics
        function updateStats(health, savedSessions) {
            document.getElementById('activeSessions').textContent = health.sessions?.length || 0;
            document.getElementById('savedSessions').textContent = savedSessions?.length || health.savedSessions || 0;
            document.getElementById('uptime').textContent = formatUptime(health.uptime);
            
            // Calculate total data from active sessions
            if (health.sessions) {
                totalBytes = health.sessions.reduce((total, session) => {
                    return total + (session.stats?.bytesReceived || 0) + (session.stats?.bytesSent || 0);
                }, 0);
                document.getElementById('totalData').textContent = formatBytes(totalBytes);
            }
        }

        // Update active sessions list
        function updateActiveSessions(sessions) {
            const container = document.getElementById('sessionsContainer');
            
            if (!sessions || sessions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">○</div>
                        <div class="empty-text">No Active Sessions</div>
                        <div class="empty-subtext">Create a new terminal to see it here</div>
                    </div>
                `;
                return;
            }
            
            const sessionsHTML = sessions.map(session => `
                <div class="session-card">
                    <div class="session-status active"></div>
                    <div class="session-info">
                        <div class="session-name">Session ${session.id.substring(0, 8)}...</div>
                        <div class="session-details">
                            <div class="session-detail">
                                <span>Created:</span>
                                <span>${formatTime(session.created)}</span>
                            </div>
                            <div class="session-detail">
                                <span>Active:</span>
                                <span>${formatDuration(Date.now() - session.created)}</span>
                            </div>
                            <div class="session-detail">
                                <span>Data:</span>
                                <span>${formatBytes(session.stats?.bytesReceived || 0)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="session-actions">
                        <button class="action-btn" onclick="openSession('${session.id}')">
                            Open
                        </button>
                        <button class="action-btn danger" onclick="closeSession('${session.id}')">
                            Close
                        </button>
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = `<div class="sessions-grid">${sessionsHTML}</div>`;
        }

        // Update saved sessions list
        function updateSavedSessions(sessions) {
            const container = document.getElementById('savedSessionsContainer');
            
            if (!sessions || sessions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">◉</div>
                        <div class="empty-text">No Saved Sessions</div>
                        <div class="empty-subtext">Sessions with share IDs will appear here</div>
                    </div>
                `;
                return;
            }
            
            const sessionsHTML = sessions.map(session => `
                <div class="session-card">
                    <div class="session-status ${session.isActive ? 'active' : 'inactive'}"></div>
                    <div class="session-info">
                        <div class="session-name">${session.name}</div>
                        <div class="session-details">
                            <div class="session-detail">
                                <span>Share ID:</span>
                                <span>${session.shareId}</span>
                            </div>
                            <div class="session-detail">
                                <span>Created:</span>
                                <span>${formatTime(session.created)}</span>
                            </div>
                            <div class="session-detail">
                                <span>Last Access:</span>
                                <span>${formatTime(session.lastAccess)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="session-actions">
                        <button class="action-btn" onclick="openSharedSession('${session.shareId}')">
                            Open
                        </button>
                        <button class="action-btn" onclick="copyShareUrl('${session.shareId}')">
                            Copy URL
                        </button>
                        <button class="action-btn danger" onclick="deleteSession('${session.shareId}')">
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = `<div class="sessions-grid">${sessionsHTML}</div>`;
        }

        // Show error message
        function showError(message) {
            const container = document.getElementById('sessionsContainer');
            container.innerHTML = `
                <div class="error-message">
                    <span class="error-icon">⚠</span>
                    <span>${message}</span>
                </div>
            `;
        }

        // Format functions
        function formatUptime(seconds) {
            if (!seconds) return '0s';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            
            if (hours > 0) {
                return `${hours}h ${minutes}m`;
            } else if (minutes > 0) {
                return `${minutes}m ${secs}s`;
            }
            return `${secs}s`;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            return date.toLocaleTimeString();
        }

        function formatDuration(ms) {
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            
            if (hours > 0) {
                return `${hours}h ${minutes % 60}m`;
            } else if (minutes > 0) {
                return `${minutes}m ${seconds % 60}s`;
            }
            return `${seconds}s`;
        }

        function formatBytes(bytes) {
            if (!bytes) return '0 KB';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // Actions
        function openSession(sessionId) {
            // For active sessions, we need to find if it has a shareId
            // and open the shared URL to connect to the existing session
            fetch(`${API_BASE}/api/sessions`)
                .then(res => res.json())
                .then(sessions => {
                    // Find session with matching sessionId
                    const session = sessions.find(s => s.sessionId === sessionId);
                    if (session && session.shareId) {
                        window.open(`${API_BASE}/terminal/${session.shareId}`, '_blank');
                    } else {
                        // If no shareId, open new terminal
                        window.open(`${API_BASE}/?connect=${sessionId}`, '_blank');
                    }
                })
                .catch(() => {
                    window.open(`${API_BASE}/`, '_blank');
                });
        }

        function openSharedSession(shareId) {
            window.open(`${API_BASE}/terminal/${shareId}`, '_blank');
        }

        function copyShareUrl(shareId) {
            const url = `${window.location.origin}/terminal/${shareId}`;
            navigator.clipboard.writeText(url).then(() => {
                alert('Share URL copied to clipboard!');
            });
        }

        async function closeSession(sessionId) {
            if (!confirm('Are you sure you want to close this session?')) return;
            
            // Would need API endpoint to close specific session
            alert('Close session functionality would be implemented here');
            fetchData();
        }

        async function deleteSession(shareId) {
            if (!confirm('Are you sure you want to delete this saved session?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/session/${shareId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    alert('Session deleted successfully');
                    fetchData();
                } else {
                    alert('Failed to delete session');
                }
            } catch (error) {
                alert('Error deleting session: ' + error.message);
            }
        }

        // Auto refresh
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(fetchData, 5000); // Refresh every 5 seconds
        }

        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            fetchData();
            startAutoRefresh();
        });

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            stopAutoRefresh();
        });
    </script>
</body>
</html>
